services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-painel_projetos}
      POSTGRES_USER: ${POSTGRES_USER:-painel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definida}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-painel_app} -d ${POSTGRES_DB:-painel_projetos}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-painel_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-painel_projetos}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET deve ser definida}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET deve ser definida}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-kbokleber}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD deve ser definida}
      SEED_OPERATOR_USERNAME: ${SEED_OPERATOR_USERNAME:-ana}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:?SEED_OPERATOR_PASSWORD deve ser definida}
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
