<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradiente azul -->
        <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Hexágono principal -->
    <path d="M 25 10 L 75 10 L 95 50 L 75 90 L 25 90 L 5 50 Z" 
          fill="url(#faviconGradient)" 
          stroke="#3b82f6" 
          stroke-width="3"/>
    
    <!-- Hexágono interno decorativo -->
    <path d="M 30 20 L 70 20 L 85 50 L 70 80 L 30 80 L 15 50 Z" 
          fill="none" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="2"
          stroke-dasharray="4,4"/>
    
    <!-- Letra K estilizada -->
    <g fill="white">
        <!-- Barra vertical do K -->
        <rect x="32" y="35" width="8" height="30" rx="3"/>
        
        <!-- Parte superior diagonal do K -->
        <path d="M 40 45 L 70 30 L 68 38 L 48 50 Z"/>
        
        <!-- Parte inferior diagonal do K -->
        <path d="M 40 55 L 70 70 L 68 62 L 48 50 Z"/>
        
        <!-- Círculo decorativo no centro -->
        <circle cx="48" cy="50" r="3" fill="#3b82f6"/>
    </g>
</svg>

