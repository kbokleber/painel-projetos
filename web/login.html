<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acesso ao Painel de Gestão de Projetos da KBO Soluções" />
    <title>Entrar | Painel de Projetos KBO</title>
  </head>
  <body>
    <main class="auth-shell" x-data="loginPage">
      <section class="auth-card" aria-labelledby="login-title">
        <header class="brand">
          <span class="brand-mark">KBO Soluções</span>
          <h1 id="login-title">Painel de Projetos</h1>
          <p class="subtitle">Entre com suas credenciais para continuar.</p>
        </header>

        <form @submit.prevent="submit" novalidate>
          <div class="form-field">
            <label for="username">Usuário</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              maxlength="80"
              required
              x-model.trim="username"
            />
          </div>
          <div class="form-field">
            <label for="password">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="512"
              required
              x-model="password"
            />
          </div>
          <p
            class="error-message"
            role="alert"
            aria-live="polite"
            x-cloak
            x-show="error"
            x-text="error"
          ></p>
          <button
            class="primary-button"
            type="submit"
            :disabled="submitting || !username || !password"
          >
            <span x-show="!submitting">Entrar</span>
            <span x-cloak x-show="submitting">Entrando…</span>
          </button>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
